[package]
name = "vku"
version = "0.4.0"
edition = "2021"
authors = ["Maximillian Pfeil <pfeil.maximillian@gmail.com>"]
description = "Utility crate for kickstarting vulkan development"
repository = "https://github.com/ArrowMaxGithub/vku"
license = "MIT OR Apache-2.0"
keywords = ["vku", "vulkan", "ash", "gpu-allocator", "shaderc"]
categories = ["api-bindings", "graphics", "rendering"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ash = {version = "0.38", default-features = false, features = ["debug"]}
ash-window = "0.13"
raw-window-handle = { version = "0.6", features = ["std"] }
log = "0.4"
thiserror = "1.0"
gpu-allocator = { git = "https://github.com/Traverse-Research/gpu-allocator", branch = "ash-0.38" }

shaderc = { version = "0.8", optional = true }

[dev-dependencies]
winit = "0.29"
env_logger = {version = "0.11", features = ["color", "humantime"]}

[features]
default = ["loaded"]
shader = ["dep:shaderc"]
linked = ["ash/linked"]
loaded = ["ash/loaded"]
